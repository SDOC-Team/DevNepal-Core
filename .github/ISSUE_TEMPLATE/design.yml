name: Design
description: Propose an interface or visual-design improvement
labels: [design, needs-spec]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for visual or interaction design proposals. For keyboard, focus, screen-reader, contrast, or touch-target problems, use the Accessibility form.
  - type: textarea
    id: problem
    attributes:
      label: What is the problem for a user?
    validations: { required: true }
  - type: textarea
    id: existing
    attributes:
      label: Which existing pattern is inadequate, and why?
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Screenshot, link, or description.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the closest area. Maintainers will apply the matching area label.
      options: ["area/portal", "area/members", "area/ui", "area/content", "area/tooling", "Not sure"]
    validations: { required: true }
  - type: textarea
    id: bilingual
    attributes:
      label: How does this work in both languages?
      description: Required. Devanagari has different line-height and width behaviour from Latin.
    validations: { required: true }
