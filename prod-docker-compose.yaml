# Production stack for Dokploy (https://docs.dokploy.com/docs/core/docker-compose).
#
# Settings: Dokploy writes the Environment tab to `.env` next to this file but
# does not inject it, so the app and migrate services load it with `env_file`.
# Every setting is listed in apps/api/.env.example; production also needs
# POSTGRES_PASSWORD and AUTH_URL, and Compose refuses to start without them.
#
# Routing: add the domain in Dokploy's Domains tab for service `app`, port 3000.
# Nothing is published on the host; Postgres is reachable only inside the stack.
#
# Data: named volumes, so Dokploy's volume backups can include them. Do not bind
# mount paths from the repository; Dokploy clears it on every deployment.

x-database-url: &database-url postgres://${POSTGRES_USER:-devnepal}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (URL-safe, e.g. openssl rand -hex 24)}@db:5432/${POSTGRES_DB:-devnepal}

services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devnepal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (URL-safe, e.g. openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-devnepal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations, then exits; the app starts only after it succeeds.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: devnepal:production
    command: ["node", "scripts/migrate.js"]
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: devnepal:production
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
      STORAGE_DIR: /app/storage
      # The GitHub callback URL is built from this; without it sign-in breaks.
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL to the public origin, e.g. https://devnepal.gov.np}
    expose:
      - "3000"
    volumes:
      - avatars:/app/storage
    networks:
      - default
      - dokploy-network
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
  avatars:
